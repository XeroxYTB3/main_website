name: Synchroniser les sites et déployer

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"      # chaque jour à 5h UTC : récupère les nouvelles versions des sites
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les sites listés dans sites.json
        env:
          GITHUB_TOKEN: ${{ github.token }}   # évite la limite de l'API GitHub pour lister les dossiers d'assets
        run: node scripts/sync.mjs
      - name: Récupérer les favicons
        run: node scripts/icons.mjs
      - name: Protéger les jeux (garde anti-copie)
        run: node scripts/protect.mjs
      - name: Icônes du portail (PNG, ICO, manifeste)
        continue-on-error: true   # si ça échoue, le logo SVG de index.html suffit
        run: |
          npm install --no-save --no-package-lock @resvg/resvg-js
          node scripts/logo.mjs
      - name: Héberger les polices
        continue-on-error: true   # si ça échoue, Google Fonts reste utilisé
        run: node scripts/fonts.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
