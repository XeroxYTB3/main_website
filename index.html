<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdf5">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='13' y='14' width='82' height='80' rx='22' fill='%233ddc97'/%3E%3Crect x='6' y='7' width='82' height='80' rx='22' fill='%23fffdf5' stroke='%231d1b2e' stroke-width='6'/%3E%3Crect x='20' y='54' width='54' height='16' rx='6' fill='%23ffd93d' transform='rotate(-3 47 62)'/%3E%3Cpath d='M30 20H52a19 19 0 0 1 0 38H44V80H30Z M44 32H51a7 7 0 0 1 0 14H44Z' fill='%231d1b2e' fill-rule='evenodd' transform='translate(-3 0)'/%3E%3C/svg%3E">
<title>Mes projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffdf5; --ink:#1d1b2e; --soft:#3b3956; --grid:#cfe3f3; --margin:#ff8aa8;
  --pink:#ff5c8a; --yellow:#ffd93d;
  --marker:"Permanent Marker","Segoe Print","Comic Sans MS",cursive;
  --hand:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--hand); font-size:1.2rem;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:32px 32px;
}
/* marge rouge du cahier */
body::before{content:"";position:fixed;top:0;bottom:0;left:max(10px,calc(50% - 500px));width:3px;background:var(--margin);opacity:.7;pointer-events:none}
.wrap{position:relative;max-width:920px;margin:0 auto;padding:0 28px}

header{padding:clamp(40px,9vh,90px) 0 8px;position:relative}
h1{
  display:inline-block; margin:0; font-family:var(--marker); font-weight:400;
  font-size:clamp(3rem,11vw,6.2rem); line-height:1.05; transform:rotate(-2deg);
}
.hl{padding:0 .22em;border-radius:.3em;background:linear-gradient(transparent 52%,var(--yellow) 52% 90%,transparent 90%)}
.under{display:block;width:min(460px,86%);height:26px;margin:2px 0 0 4px}
.under path{fill:none;stroke:var(--pink);stroke-width:7;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sub{display:flex;align-items:center;gap:12px;margin:22px 0 0;font-size:1.5rem;color:var(--soft);transform:rotate(-1deg)}
.sub svg{flex:none;width:54px;height:46px}
.star{position:absolute;right:2%;top:clamp(24px,6vh,60px);width:clamp(54px,12vw,96px);transform:rotate(14deg)}

.find{
  display:none;width:100%;max-width:420px;margin:26px 0 0;padding:12px 22px;border:3px solid var(--ink);border-radius:999px;
  background:#fff;color:var(--ink);font:inherit;font-size:1.3rem;
}
.find:focus{outline:3px solid var(--pink);outline-offset:2px}
.find.on{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:52px 34px;padding:56px 0 72px;margin:0;list-style:none}

/* ===== cartes très arrondies ===== */
.card{
  --c:#3ddc97; --r:-1.5deg;
  position:relative;isolation:isolate;display:flex;flex-direction:column;gap:8px;height:100%;
  padding:38px 28px 28px;color:var(--ink);text-decoration:none;
  transform:rotate(var(--r));transition:transform .2s ease;
}
.card::before{
  content:"";position:absolute;inset:0;z-index:-1;background:#fff;border:3px solid var(--ink);
  border-radius:46px 38px 50px 38px/38px 50px 38px 46px;
  box-shadow:7px 8px 0 var(--c);filter:url(#rough);transition:box-shadow .2s ease;
}
/* scotch arrondi */
.card::after{
  content:"";position:absolute;top:-15px;left:50%;width:96px;height:30px;z-index:1;border-radius:12px;
  transform:translateX(-50%) rotate(-4deg);
  background:color-mix(in srgb,var(--c) 55%,transparent);
  border-left:3px dotted rgba(29,27,46,.25);border-right:3px dotted rgba(29,27,46,.25);
}
a.card:hover,a.card:focus-visible{transform:rotate(0deg) translateY(-6px);outline:none}
a.card:hover::before,a.card:focus-visible::before{box-shadow:11px 13px 0 var(--c)}
a.card:focus-visible::before{border-color:var(--pink);border-width:4px}

.icon{width:92px;height:92px;margin:0 0 4px -4px;display:flex;align-items:center;justify-content:center;font-size:3.2rem}
.icon svg{width:100%;height:100%;overflow:visible}
/* vrai favicon du site */
.fav{width:76px;height:76px;object-fit:contain;border-radius:16px;display:block}
.name{font-family:var(--marker);font-weight:400;font-size:1.8rem;line-height:1.1;margin:0}
.desc{margin:0;flex:1;color:var(--soft);font-size:1.25rem;line-height:1.3}
.go{
  position:relative;isolation:isolate;align-self:flex-start;margin-top:12px;padding:7px 24px;
  font-family:var(--marker);font-size:1.05rem;
}
.go::before{
  content:"";position:absolute;inset:0;z-index:-1;background:var(--c);border:2.5px solid var(--ink);
  border-radius:999px;filter:url(#rough);
}

/* carte "bientôt" */
.card.soon{--r:1.4deg}
.card.soon::before{background:transparent;border-style:dashed;box-shadow:none}
.card.soon::after{display:none}
.card.soon .name{color:var(--soft)}
.q{font-family:var(--marker);font-size:3.4rem;line-height:1;color:var(--pink);transform:rotate(-8deg);margin:0 0 4px 6px}

.empty{padding:20px 0;color:var(--soft)}

@media (max-width:520px){
  .wrap{padding:0 22px}
  .star{display:none}
  .grid{gap:48px 24px}
}
@media (prefers-reduced-motion:reduce){
  .under path{animation:none;stroke-dashoffset:0}
  .card,.card::before{transition:none}
  a.card:hover,a.card:focus-visible{transform:rotate(var(--r))}
}

/* ===== lecteur : le projet s'ouvre dans un cadre (barre du haut, cadre, barre du bas) ===== */
body.playing{overflow:hidden}
#player{
  --c:#3ddc97;
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:32px 32px;
}
#player[hidden]{display:none}
.ptop{display:flex;align-items:center;gap:16px}
.plogo{display:flex;align-items:center;gap:10px;flex:none;border:0;background:none;padding:0;color:var(--ink);font-family:var(--marker);font-size:1.4rem;cursor:pointer}
.plogo svg{width:44px;height:44px}
.psearch{position:relative;flex:1;max-width:520px;margin:0 auto}
.psearch input{width:100%;padding:9px 20px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:1.1rem}
.psearch input:focus{outline:3px solid var(--pink);outline-offset:2px}
#pList{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:5;margin:0;padding:6px;list-style:none;background:#fff;border:3px solid var(--ink);border-radius:20px}
#pList[hidden]{display:none}
#pList button{width:100%;text-align:left;padding:8px 14px;border:0;border-radius:14px;background:none;color:var(--ink);font:inherit;cursor:pointer}
#pList button:hover,#pList button:focus-visible{background:var(--yellow);outline:none}
.stage{flex:1;min-height:0;border:3px solid var(--ink);border-radius:22px;background:#fff;overflow:hidden;box-shadow:7px 8px 0 var(--c)}
.stage iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 6px}
.pinfo{display:flex;align-items:center;gap:12px;min-width:0}
.pico{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.pico img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.pico svg{width:100%;height:100%}
#pName{font-family:var(--marker);font-weight:400;font-size:1.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtns{display:flex;gap:10px;flex:none}
.pb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:50%;background:#fff;color:var(--ink);cursor:pointer;padding:0}
.pb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pb:hover,.pb:focus-visible{background:var(--yellow);outline:none}
.pb.on{background:var(--pink);color:#fff}
.pb.on svg{fill:currentColor}
.pb.ok{background:var(--c)}
@media (max-width:520px){.plogo span{display:none}.ptop{gap:10px}}

/* ===== écran de chargement (style doodle : barre rayée) ===== */
body.loading{overflow:hidden}
#loader{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:32px 32px;
  transition:opacity .45s ease,transform .45s ease;
}
#loader::before{content:"";position:absolute;top:0;bottom:0;left:max(10px,calc(50% - 500px));width:3px;background:var(--margin);opacity:.7}
#loader[hidden]{display:none}
#loader.done{opacity:0;transform:scale(1.03);pointer-events:none}
.lwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px}
.llogo{width:128px;height:128px;overflow:visible;filter:url(#rough);transform-origin:50% 60%;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.ltext{margin:6px 0 0;font-family:var(--marker);font-size:1.9rem;color:var(--ink);text-align:center;transform:rotate(-1.5deg)}
.dots i{font-style:normal;color:var(--pink);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
.lbar{width:min(360px,82vw)}
.lbar svg{display:block;width:100%;height:auto;overflow:visible;filter:url(#rough)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #loader{transition:none}
  .llogo{animation:none}
  .dots i{animation:none}
}
</style>
</head>

<script>
/* Les projets viennent du fichier sites.json (même dossier que ce fichier).
   Chaque projet : id (nom du dossier), title, desc, url (site déployé),
   color, cta (texte du bouton).
   Icône : "favicon" (ajouté automatiquement au déploiement par scripts/icons.mjs),
   sinon repli sur icon ("ball8" ou "star") ou emoji.                       */
var PROJECTS = [];

var ICONS = {
  ball8:
    '<svg viewBox="0 0 92 92" aria-hidden="true">' +
    '<path d="M8 46c0-20 15-34 33-32 20 2 32 18 30 36-2 20-18 31-36 29C20 77 8 63 8 46z" fill="var(--c)" opacity=".6"/>' +
    '<g filter="url(#rough)">' +
    '<circle cx="46" cy="46" r="32" fill="#1d1b2e"/>' +
    '<circle cx="46" cy="41" r="14" fill="#fff"/>' +
    '<text x="46" y="47" text-anchor="middle" font-size="19" fill="#1d1b2e" style="font-family:var(--marker)">8</text>' +
    '<path d="M26 30 C 29 24, 35 20, 42 18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>' +
    '</g></svg>',
  star:
    '<svg viewBox="0 0 92 92" aria-hidden="true">' +
    '<path d="M8 46c0-20 15-34 33-32 20 2 32 18 30 36-2 20-18 31-36 29C20 77 8 63 8 46z" fill="var(--c)" opacity=".6"/>' +
    '<path d="M46 10 L55 35 L82 37 L61 54 L68 80 L46 66 L24 80 L31 54 L10 37 L37 35 Z" fill="#ffd93d" stroke="#1d1b2e" stroke-width="3.5" stroke-linejoin="round" filter="url(#rough)"/>' +
    '</svg>'
};
var ROT = [-1.6, 1.3, -0.8, 1.8, -1.2, 0.9];

var grid = document.getElementById('grid');
var empty = document.getElementById('empty');
var find = document.getElementById('find');

/* ===== écran de chargement : barre tracée au feutre, 1,3 s minimum ===== */
var loader = document.getElementById('loader');
var clipEl = document.getElementById('lClip');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var MIN_MS = reduce ? 300 : 1300; // durée minimale du tracé
var raf = 0, opening = false;

// paliers irréguliers : le coloriage avance par à-coups, comme à la main
var STEPS = (function () {
  var a = [0], v = 0;
  while (v < 0.97) { v += 0.025 + Math.random() * 0.07; a.push(Math.min(v, 1)); }
  a.push(1);
  return a;
})();
var shown = 0;

function setProgress(p) {
  if (p < 0.002) { clipEl.setAttribute('points', '0,0 0,0 0,0'); return; }
  var xf = 11 + p * 326; // bord avant incliné comme les rayures
  clipEl.setAttribute('points', '11,11 ' + (xf + 4).toFixed(1) + ',11 ' + (xf - 4).toFixed(1) + ',35 11,35');
}
function showLoader() {
  loader.hidden = false;
  loader.classList.remove('done');
  document.body.classList.add('loading');
  shown = 0;
  setProgress(0);
}
function hideLoader() {
  loader.classList.add('done');
  document.body.classList.remove('loading');
  setTimeout(function () { if (loader.classList.contains('done')) loader.hidden = true; }, 500);
}
// colorie en MIN_MS minimum ; attend "ready" avant de dépasser 92 %
function runLoader(ready, onEnd) {
  cancelAnimationFrame(raf);
  showLoader();
  var t0 = performance.now(), ok = false;
  var go = function () { ok = true; };
  ready.then(go, go);
  (function tick(now) {
    var t = Math.min(1, (now - t0) / MIN_MS);
    var target = Math.min(t, ok ? 1 : 0.92);
    var thr = 0;
    for (var i = 0; i < STEPS.length; i++) if (STEPS[i] <= target) thr = STEPS[i];
    if (reduce) shown = target;
    else {
      shown += (thr - shown) * 0.4;           // petit coup de feutre rapide
      if (thr - shown < 0.002) shown = thr;
    }
    setProgress(shown);
    if (shown >= 0.999) { setProgress(1); setTimeout(onEnd, reduce ? 0 : 200); return; }
    raf = requestAnimationFrame(tick);
  })(t0);
}
function onProjectClick(e) {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  if (opening) return;
  opening = true;
  var href = e.currentTarget.href, id = e.currentTarget.dataset.id;
  // pendant que la barre se trace, on précharge la page du jeu (4 s max)
  var warm = Promise.race([
    fetch(href).then(function (r) { return r.text(); }),
    new Promise(function (r) { setTimeout(r, 4000); })
  ]);
  runLoader(warm, function () { opening = false; location.hash = id; hideLoader(); });
}
// retour arrière du navigateur : on ne laisse pas l'écran de chargement affiché
window.addEventListener('pageshow', function (e) { if (e.persisted) { opening = false; cancelAnimationFrame(raf); hideLoader(); } });

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function render() {
  var t = find.value.trim().toLowerCase();
  var shown = PROJECTS.filter(function (p) {
    return ((p.title || p.id) + ' ' + (p.desc || '')).toLowerCase().indexOf(t) !== -1;
  });
  grid.innerHTML = '';
  empty.hidden = shown.length > 0;

  shown.forEach(function (p, i) {
    var li = el('li');
    var a = el('a', 'card');
    a.href = './' + p.id + '/';
    a.addEventListener('click', onProjectClick);
    a.style.setProperty('--c', p.color || '#4aa8ff');
    a.style.setProperty('--r', ROT[i % ROT.length] + 'deg');

    a.dataset.id = p.id;

    // icône : vrai favicon du site, sinon repli sur l'icône dessinée / l'emoji
    var icon = el('div', 'icon');
    fillIcon(icon, p, 'fav');

    a.appendChild(icon);
    a.appendChild(el('h2', 'name', p.title || p.id));
    a.appendChild(el('p', 'desc', p.desc || ''));
    a.appendChild(el('span', 'go', p.cta || 'Ouvrir'));
    li.appendChild(a);
    grid.appendChild(li);
  });

  // carte "bientôt" (masquée pendant une recherche)
  if (!t) {
    var li2 = el('li');
    var s = el('div', 'card soon');
    s.appendChild(el('div', 'q', '?'));
    s.appendChild(el('h2', 'name', 'Bientôt'));
    s.appendChild(el('p', 'desc', 'Un nouveau projet arrive prochainement.'));
    li2.appendChild(s);
    grid.appendChild(li2);
  }
}

find.addEventListener('input', render);

/* icône d'un projet : vrai favicon, sinon repli sur l'icône dessinée / l'emoji */
function fillIcon(box, p, cls) {
  var fallback = function () {
    box.innerHTML = '';
    if (p.icon && ICONS[p.icon]) box.innerHTML = ICONS[p.icon];
    else box.textContent = p.emoji || '⭐';
  };
  box.innerHTML = '';
  if (p.favicon) {
    var img = new Image();
    img.className = cls;
    img.alt = '';
    img.onerror = fallback;
    img.src = './' + p.favicon;
    box.appendChild(img);
  } else fallback();
}

/* ===== lecteur : le projet s'ouvre dans un cadre, l'adresse devient  #id ===== */
var player = document.getElementById('player');
var stage = document.getElementById('stage');
var frame = document.getElementById('pFrame');
var pName = document.getElementById('pName');
var pIco = document.getElementById('pIco');
var pFind = document.getElementById('pFind');
var pList = document.getElementById('pList');
var pLike = document.getElementById('pLike');
var pShare = document.getElementById('pShare');
var pFs = document.getElementById('pFs');
var current = null;

function byId(id) {
  for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return PROJECTS[i];
  return null;
}
function syncLike() {
  var on = false;
  try { on = localStorage.getItem('like:' + current.id) === '1'; } catch (e) {}
  pLike.classList.toggle('on', on);
}
function openProject(id) {
  var p = byId(id);
  if (!p) return false;
  current = p;
  player.style.setProperty('--c', p.color || '#3ddc97');
  pName.textContent = p.title || p.id;
  fillIcon(pIco, p, 'fav');
  frame.title = p.title || p.id;
  frame.src = './' + p.id + '/';
  syncLike();
  pFind.value = '';
  pList.hidden = true;
  player.hidden = false;
  document.body.classList.add('playing');
  document.title = (p.title || p.id) + ' – Mes projets';
  return true;
}
function closePlayer() {
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  frame.src = 'about:blank';
  player.hidden = true;
  document.body.classList.remove('playing');
  document.title = 'Mes projets';
  current = null;
}
function fromHash() {
  var id = decodeURIComponent(location.hash.slice(1));
  if (id && openProject(id)) return;
  closePlayer();
}
window.addEventListener('hashchange', fromHash);

document.getElementById('pHome').addEventListener('click', function () { location.hash = ''; });
document.getElementById('pClose').addEventListener('click', function () { location.hash = ''; });

pFind.addEventListener('input', function () {
  var t = pFind.value.trim().toLowerCase();
  pList.innerHTML = '';
  var hits = t ? PROJECTS.filter(function (p) {
    return ((p.title || p.id) + ' ' + (p.desc || '')).toLowerCase().indexOf(t) !== -1;
  }) : [];
  hits.forEach(function (p) {
    var li = el('li');
    var b = el('button', null, p.title || p.id);
    b.type = 'button';
    b.addEventListener('click', function () { location.hash = p.id; });
    li.appendChild(b);
    pList.appendChild(li);
  });
  pList.hidden = hits.length === 0;
});

pLike.addEventListener('click', function () {
  var on = !pLike.classList.contains('on');
  try { localStorage.setItem('like:' + current.id, on ? '1' : '0'); } catch (e) {}
  pLike.classList.toggle('on', on);
});
pShare.addEventListener('click', function () {
  if (!navigator.clipboard || !navigator.clipboard.writeText) return;
  navigator.clipboard.writeText(location.href).then(function () {
    pShare.classList.add('ok');
    setTimeout(function () { pShare.classList.remove('ok'); }, 1200);
  }, function () {});
});
// plein écran : masqué là où le navigateur ne le permet pas (iPhone)
if (!stage.requestFullscreen) pFs.hidden = true;
pFs.addEventListener('click', function () {
  if (document.fullscreenElement) document.exitFullscreen();
  else stage.requestFullscreen().catch(function () {});
});

var sitesReady = fetch('sites.json', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (list) {
    PROJECTS = list;
    if (PROJECTS.length > 6) find.classList.add('on');
    render();
    if (location.hash.length > 1) fromHash();
  })
  .catch(function () {
    grid.innerHTML = '';
    empty.textContent = 'Impossible de charger la liste des projets (sites.json).';
    empty.hidden = false;
  });
var fontsReady = Promise.race([
  document.fonts ? document.fonts.ready : Promise.resolve(),
  new Promise(function (r) { setTimeout(r, 2500); })
]);
runLoader(Promise.all([sitesReady, fontsReady]), hideLoader);
</script>
</body>
